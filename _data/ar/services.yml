items:
  - title: تطوير الويب
    icon: device-laptop
    description: بناء مواقع وتطبيقات ويب سريعة الاستجابة وعالية الأداء تعمل بسلاسة على مختلف الأجهزة.
    why: موقعك هو الواجهة الرقمية لعلامتك التجارية — السرعة، وتحسين محركات البحث، وسهولة الاستخدام تلعب دورًا أساسيًا في جذب المستخدمين وزيادة التفاعل.
    deliverables:
      - تصميم واجهات وتخطيطات متجاوبة
      - تحسين الأداء وتجربة المستخدم وتهيئة SEO
      - إعداد أدوات التحليلات والمراقبة