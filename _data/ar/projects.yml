items:
  - title: Backdoor
    description: منصة حديثة لعرض الأعمال والخدمات تم تطويرها باستخدام React وTailwind CSS لعرض المشاريع والحلول الرقمية من خلال واجهة نظيفة ومتجاوبة. تركز المنصة على تقديم تجربة مستخدم سلسة وهوية بصرية احترافية، مع أقسام تفاعلية وعروض للمشاريع والخدمات وصفحة تواصل مبسطة تساعد العملاء المحتملين على الوصول بسهولة. تم تصميمها بأسلوب عصري يعزز التفاعل وسهولة القراءة وإمكانية الوصول عبر أجهزة الحاسب والجوال.
    images:
      - /assets/images/projects/back1.png
      - /assets/images/projects/back2.png
      - /assets/images/projects/back3.png
    link: ""
    tags:
      - React
      - Tailwind CSS
      - Responsive Design
    year: 2025
    link_type: demo

  - title: NEXA
    description: منصة أعمال حديثة مطورة باستخدام ASP.NET Core لعرض الحلول الرقمية والخدمات الاحترافية ومشاريع الشركة من خلال تجربة مستخدم نظيفة ومتجاوبة. تتضمن صفحة رئيسية ديناميكية تستعرض الخدمات والمشاريع وعناصر تعزز الثقة ونماذج تواصل تساعد الشركات على جذب العملاء المحتملين. كما تحتوي على لوحة تحكم آمنة لإدارة المشاريع والمحتوى والخدمات المعروضة من خلال واجهة إدارة مبسطة.
    images:
      - /assets/images/projects/nexa1.png
      - /assets/images/projects/nexa2.png
      - /assets/images/projects/nexa3.png
    link: ""
    tags:
      - ASP.NET Core
