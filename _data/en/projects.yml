    link_type: live

  - title: NEXA
    description: Modern business platform built with ASP.NET Core to showcase tailored digital solutions, professional services, and company projects through a clean and responsive user experience. The website features a dynamic landing page with service highlights, trust-focused sections, portfolio showcases, and contact forms designed to help businesses connect with potential clients and generate leads. Includes a secure admin dashboard for managing portfolio projects, updating content, editing showcased services, and handling website data through a streamlined content management interface.
