items:
  - title: Backdoor
    description: Modern portfolio and business showcase web application built with React and Tailwind CSS to present projects, services, and digital solutions through a clean and responsive interface. The platform focuses on professional presentation, smooth user experience, and strong visual identity, featuring animated sections, project showcases, service highlights, and a streamlined contact experience that helps potential clients connect quickly and efficiently. Designed with a modern UI approach to improve engagement, readability, and accessibility across desktop and mobile devices.
