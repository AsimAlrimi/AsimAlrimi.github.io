      - /assets/images/projects/book2.png
    link: "https://github.com/AsimAlrimi/bookify.git"
    tags:
      - Flutter
      - Dart
      - SQLite
      - Role-Based Access

    year: 2024
    link_type: github

  - title: Search Algorithm Visualizer
    description: Interactive Python application built with Tkinter to visualize binary tree traversal algorithms through real-time animations and dynamic node highlighting. The project demonstrates how Breadth-First Search (BFS) and Depth-First Search (DFS) operate on a binary tree structure, allowing users to select target nodes and observe the traversal process step-by-step through an intuitive graphical interface.
    images:
      - /assets/images/projects/bst1.png
      - /assets/images/projects/bst2.png
      - /assets/images/projects/bst3.png
    link: "https://github.com/AsimAlrimi/search-algorithm-visualizer.git"
    tags:
