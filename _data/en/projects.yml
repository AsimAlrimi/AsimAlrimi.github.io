  - title: Bookify
    description: Flutter-based book rental application designed to help users browse, search, and rent books through a clean and modern mobile interface. The platform includes role-based functionality for Users and Admins, allowing admins to manage books, upload cover images, update availability status, and oversee rental orders. Features include book search, detailed book pages, rental history tracking, SQLite local storage, and state management using Riverpod for a responsive and scalable user experience.
    images:
