      - MVC
      - Entity Framework Core
      - SQL Server
      - Role-Based Access
    year: 2025
    link_type: github
  
  - title: Blood Line
    description: Comprehensive blood donation management platform built using a client-server architecture to connect donors, hospitals, and blood banks through mobile and desktop applications. Developed with Flutter, Flask, and RESTful APIs, the system streamlines appointment scheduling, donation tracking, blood drive management, and donor communication. Features include JWT authentication, role-based functionality, Google Maps integration for locating nearby donation centers, notifications for urgent blood needs, donation history tracking, and secure backend API testing with Postman.
