<div class="group rounded-2xl overflow-hidden border border-white/10 hover:shadow-lg transition-shadow duration-300 flex flex-col">

  <div class="overflow-hidden h-72 bg-neutral-100 dark:bg-neutral-900 shrink-0">
    <img src="{{ include.project.image }}"
         alt="{{ include.project.title }}"
         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
  </div>

  <div class="p-5 flex flex-col gap-2 light:bg-primary/8 bg-white/5 backdrop-blur-lg border-t border-white/10 flex-1">

    <div class="flex justify-between items-baseline">
      <span class="text-lg font-bold {% if include.lang == 'ar' %}font-text{% else %}font-sans{% endif %}">
        {{ include.project.title }}
      </span>
      <span class="font-sans text-sm light:text-neutral-500  text-neutral-400">
        {{ include.project.year }}
      </span>
    </div>

    <p class="text-sm light:text-neutral-500  text-neutral-400 leading-relaxed flex-1  {% if include.lang == 'ar' %}font-text{% else %}font-sans{% endif %}">
      {{ include.project.description }}
    </p>

    <div class="flex gap-2 flex-wrap mt-1 {% if is_ar %}flex-row-reverse{% endif %}">
      {% for tech in include.project.technologies %}
        <span class="font-sans text-xs px-2 py-1 rounded-full  bg-neutral-800 light:text-neutral-200  text-neutral-400">
          {{ tech }}
        </span>
      {% endfor %}
    </div>

  </div>

</div>
