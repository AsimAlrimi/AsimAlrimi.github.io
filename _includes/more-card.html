<a href="{{ include.link }}"
   class="group rounded-2xl overflow-hidden border-t border-white/10 hover:shadow-lg transition-shadow duration-300 flex flex-col">

  <div class="p-5 min-h-[120px] flex flex-col gap-2 light:bg-primary/8 bg-white/5 backdrop-blur-lg border-b border-white/10">

    <div class="flex justify-between items-baseline">
      <span class="font-semibold text-lg  {% if include.lang == 'ar' %}font-text font-bold{% else %}font-sans{% endif %}">
        {{ include.title }}
      </span>
    </div>

    <p class="text-sm light:text-neutral-500  text-neutral-400 leading-relaxed  {% if include.lang == 'ar' %}font-text{% else %}font-sans{% endif %}">
      {{ include.description }}
    </p>

  </div>

  <!-- <div class="overflow-hidden h-56 light:bg-primary/8 bg-neutral-900">

    <img src="{{ include.image }}"
         alt="{{ include.title }}"
         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">

  </div> -->

</a>
