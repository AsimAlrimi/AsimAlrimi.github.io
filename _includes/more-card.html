<a href="{{ include.link }}"
   class="group flex flex-row items-center gap-4 px-4 py-3.5 rounded-2xl
          border border-white/10 light:bg-primary/8 bg-white/5
          light:hover:bg-primary/8 hover:bg-white/5 hover:border-white/20
          transition-all duration-200 min-w-0">

  <i class="ti ti-{{ include.icon }} text-3xl lg:text-5xl shrink-0
            text-(--text) opacity-60
            group-hover:opacity-100 transition-opacity duration-200"></i>

  <div class="flex flex-col gap-0.5 min-w-0 flex-1">
    <span class="text-base font-sans text-(--text) leading-snug {% if include.lang == 'ar' %}font-text font-bold{% else %}font-sans{% endif %} pb-1">
      {{ include.title }}
    </span>
    <span class="text-xs light:text-neutral-500 text-neutral-400 leading-snug {% if include.lang == 'ar' %}font-text{% else %}font-sans{% endif %}">
      {{ include.description }}
    </span>
  </div>
</a>
