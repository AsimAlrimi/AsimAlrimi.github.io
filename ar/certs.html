---
layout: default
title:  الشهادات والدورات
lang: ar
---

{% assign certi = site.data[page.lang].cerit %}

<section class="px-6 pb-24">

  <!-- Header -->
  <div class="flex flex-col gap-0.5 font-space px-7 pt-5 pb-7 mb-2">
    <div class="flex items-center">
      <div class="text-[clamp(3.5rem,8vw,7.5rem)] font-semibold font-display leading-none -ml-[0.07em]">
        شهادات
      </div>
      <div class="flex-1 mx-4 h-px bg-gray-600/50"></div>
    </div>
  </div>

  <!-- Cards -->
  <div class="px-7 flex flex-col gap-4">
    {% for cert in certi.items %}
    <div class="group grid grid-cols-1 sm:grid-cols-[220px_1fr] lg:grid-cols-[260px_1fr]
                rounded-2xl overflow-hidden
                border border-white/10 light:bg-primary/8 bg-white/5
                hover:border-white/20 hover:bg-white/[0.07]
                transition-all duration-300">

      <!-- Image -->
      <div class="relative h-52 sm:h-auto overflow-hidden ">
        <img src="{{ cert.image }}" alt="{{ cert.title }}"
             class="absolute inset-0 w-full h-full object-cover
                    opacity-75 group-hover:opacity-100
                    scale-100 group-hover:scale-105
                    transition-all duration-500">
      </div>

      <!-- Content -->
      <div class="flex flex-col justify-between gap-4 px-6 py-5">

        <div class="flex flex-col gap-2">
          <span class="text-[0.65rem] font-sans text-(--text-muted) uppercase tracking-[0.2em]">
            {{ cert.year }}
          </span>
          <span class="text-base sm:text-lg font-sans text-(--text) leading-snug">
            {{ cert.title }}
          </span>
          <span class="text-xs font-text text-neutral-500 dark:text-neutral-400 leading-relaxed">
            {{ cert.description }}
          </span>
        </div>

        <!-- Bottom row -->
        <a href="{{ cert.link }}" target="_blank" rel="noopener noreferrer"
        class="flex items-center gap-2">
        
        <div class="h-px flex-1 bg-white/10"></div>

        <span class="text-[0.6rem] font-text  text-(--text-muted) uppercase tracking-widest
                    opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            عرض الوثائق
        </span>

        <i class="ti ti-arrow-up-right text-xs text-(--text-muted)
                    opacity-0 group-hover:opacity-100 transition-opacity duration-300"></i>
        </a>

      </div>
    </div>
    {% endfor %}
  </div>

</section>
